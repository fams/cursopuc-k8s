# VirtualService que decide o PESO de cada subset (os subsets em si são
# definidos pelo DestinationRule, aplicado direto da amostra oficial do
# Istio no passo anterior). Aqui: 90% do tráfego pra v1, 10% pra v3.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reviews
spec:
  hosts:
    - reviews
  http:
    - route:
        - destination:
            host: reviews
            subset: v1
          weight: 90               # <- 90% do tráfego
        - destination:
            host: reviews
            subset: v3
          weight: 10               # <- 10% do tráfego
