apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpine-reader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpine-reader
  template:
    metadata:
      labels:
        app: alpine-reader
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3d-lab-agent-0
      containers:
      - name: alpine-reader
        image: alpine
        command: ["/bin/sh", "-c", "tail -f /mnt/data/date.txt"]
        volumeMounts:
        - name: data-volume
          mountPath: /mnt/data
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 200Mi
      volumes:
      - name: data-volume
        hostPath:
          path: /var/lib/k8s-pvs/direct-volume
          type: DirectoryOrCreate